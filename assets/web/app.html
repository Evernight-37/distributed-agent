<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>协作工作台</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <div id="login" class="login"></div>
    <div id="app" class="layout hidden">
      <aside class="sidebar" aria-label="主导航">
        <div class="logo" title="协作工作台" aria-label="协作工作台">
          <span class="logo-icon">◎</span>
        </div>
        <button
          id="dashboardNav"
          class="nav"
          title="控制台"
          aria-label="控制台"
        >
          <span aria-hidden="true">▦</span>
        </button>
        <button
          id="transfersNav"
          class="nav"
          title="文件速传"
          aria-label="文件速传"
        >
          <span aria-hidden="true">⇄</span>
        </button>
        <button id="settingsNav" class="nav" title="设置" aria-label="设置">
          <span aria-hidden="true">⚙</span>
        </button>
        <button
          id="accountNav"
          class="nav account-nav"
          title="账户"
          aria-label="账户"
        >
          <span id="avatar" class="avatar" aria-hidden="true"></span>
        </button>
        <div class="sidebar-foot hidden">
          <strong id="profileName"></strong><span id="deviceCount"></span
          ><span id="localName"></span><button id="logout">退出账户</button
          ><button id="quitApp">完全退出</button>
        </div>
      </aside>
      <main id="content"></main>
    </div>
    <div id="modalWrap" class="modal-wrap hidden">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div class="row">
          <h2 id="modalTitle"></h2>
          <button id="closeModal" aria-label="关闭">×</button>
        </div>
        <div id="modalBody"></div>
        <div id="modalActions" class="modal-actions"></div>
      </div>
    </div>
    <div id="toast" class="toast hidden" role="status"></div>
    <script src="app/core.js"></script>
    <script src="app/dashboard.js"></script>
    <script src="app/transfers.js"></script>
    <script src="app/project.js"></script>
    <script src="app/settings-components.js"></script>
    <script src="app/account-settings.js"></script>
    <script src="app/runtime.js"></script>
  </body>
</html>
