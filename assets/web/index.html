<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agent Harness 协作服务</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3f5f8;
        color: #1f2937;
      }
      main {
        width: min(34rem, calc(100% - 3rem));
        padding: 2rem;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 1rem 3rem #0f172a1a;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      p {
        line-height: 1.7;
      }
      a {
        color: #3158a6;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111827;
          color: #e5e7eb;
        }
        main {
          background: #1f2937;
        }
        a {
          color: #9db8ff;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>协作服务运行中</h1>
      <p>
        浏览器工作台已经停用。请在 Agent Harness 桌面应用中登录，或在 Codex
        中通过本机 MCP 使用协作功能。
      </p>
      <p><a href="/guide">打开新手教程</a></p>
    </main>
  </body>
</html>
