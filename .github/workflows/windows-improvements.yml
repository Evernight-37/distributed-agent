name: Build Windows improvements

on:
  push:
    branches: [windows-improvements]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci

      - name: Verify source
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests
          python -m unittest discover -s tests -t . -q
          npm run format:check
          npm test

      - name: Build full app including employee deletion
        run: python scripts/build_desktop.py --output-root release

      - name: Verify packaged receiver
        env:
          AGENT_HARNESS_TEST_BUNDLE: ${{ github.workspace }}\release\AgentHarness
        run: python -m unittest tests.test_desktop.PackagedReceiverTests -q

      - name: Verify clean installation
        run: python tests/cleanroom_release.py release/AgentHarness build/cleanroom

      - name: Package full app
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $name = "AgentHarness-$version-windows-x64"
          Compress-Archive -LiteralPath release/AgentHarness -DestinationPath "$name.zip" -CompressionLevel Optimal
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Set-Content "$name.zip.sha256"
          "PACKAGE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            AgentHarness-*-windows-x64.zip
            AgentHarness-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
