name: Collect v1 release failure log

on:
  push:
    tags:
      - "collect-v1-log"

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Save the failed-step log on a temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $runs = gh run list --workflow release.yml --limit 20 --json databaseId,headBranch,createdAt | ConvertFrom-Json
          $run = $runs | Where-Object { $_.headBranch -eq "v1.0.0" } | Sort-Object createdAt -Descending | Select-Object -First 1
          if (-not $run) { throw "No v1.0.0 release workflow was found" }
          gh run view $run.databaseId --log-failed | Set-Content release-failure.log -Encoding utf8
          git checkout --orphan release-diagnostic
          git rm -rf .
          git add -f release-failure.log
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -m "Temporary release failure log"
          git push --force origin release-diagnostic
          git push origin :refs/tags/collect-v1-log
