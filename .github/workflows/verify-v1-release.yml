name: Verify v1.0.0 release assets

on:
  push:
    tags:
      - "verify-v1.0.0"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for both release assets and publish completion marker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = "AgentHarness-v1.0.0-windows-x64.zip"
          $sum = "$zip.sha256.txt"
          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            $json = gh release view v1.0.0 --json assets 2>$null
            if ($LASTEXITCODE -eq 0) {
              $names = ($json | ConvertFrom-Json).assets.name
              if ($names -contains $zip -and $names -contains $sum) { $ready = $true; break }
            }
            Start-Sleep -Seconds 20
          }
          if (-not $ready) { throw "v1.0.0 release assets were not published in time" }
          git tag release-verified-v1.0.0 $env:GITHUB_SHA
          git push origin release-verified-v1.0.0
          git push origin :refs/tags/verify-v1.0.0
