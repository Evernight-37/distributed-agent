name: Release Agent Harness

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify tag and install dependencies
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag does not match VERSION" }
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Verify source
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests
          python -m unittest discover -s tests -t . -q
          npm run format:check
          npm test
      - name: Build and verify Windows app
        shell: pwsh
        run: |
          python scripts/build_desktop.py --output-root release
          $env:AGENT_HARNESS_TEST_BUNDLE = "$env:GITHUB_WORKSPACE\release\AgentHarness"
          python -m unittest tests.test_desktop.PackagedReceiverTests -q
          python tests/cleanroom_release.py release/AgentHarness build/cleanroom
      - name: Package Windows portable release
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/package_windows_release.py release/AgentHarness "AgentHarness-$version-windows-x64.zip"
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Get-Content VERSION -Raw).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "/DSourceDir=$env:GITHUB_WORKSPACE\release\AgentHarness" "/DMyAppVersion=$version" installer\windows\AgentHarness.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (-not (Test-Path "AgentHarness-$version-windows-x64-setup.exe")) { throw "Installer output missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            AgentHarness-*-windows-x64.zip
            AgentHarness-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: x64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-linux-build.txt
      - name: Verify tag and install dependencies
        run: |
          test "v$(tr -d '\r\n' < VERSION)" = "$GITHUB_REF_NAME"
          python -m pip install -e . -r requirements-linux-build.txt ruff==0.14.1 pywebview==6.2.1
      - name: Verify and build Linux receiver
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests
          python -m unittest discover -s tests -t . -q
          python scripts/build_linux_receiver.py --output-root release
          mkdir -p build/linux-smoke
          tar -xzf release/AgentHarness-*-linux-*.tar.gz -C build/linux-smoke
          build/linux-smoke/AgentHarness-linux/harness --help
          build/linux-smoke/AgentHarness-linux/runtime/bin/python3 -I -c \
            "import ssl, sqlite3; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; import agent_harness.desktop_service, agent_harness.headless_transfers; key=Ed25519PrivateKey.generate(); key.public_key().verify(key.sign(b'check'), b'check'); print('Linux service bundle OK')"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.architecture }}
          path: release/AgentHarness-*-linux-*.tar.gz*
          if-no-files-found: error
          retention-days: 7

  macos:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-macos.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify and build macOS app
        run: |
          test "v$(tr -d '\r\n' < VERSION)" = "$GITHUB_REF_NAME"
          python -m pip install -r requirements-macos.txt -r requirements-dev.txt
          npm ci
          python -m ruff check src scripts tests
          python -m ruff format --check src scripts tests
          python -m unittest tests.test_macos -q
          python scripts/build_macos.py --output-root release/macos --python-runtime "$(python -c 'import sys; print(sys.base_prefix)')"
          python scripts/package_macos_release.py \
            --app release/macos/AgentHarness.app \
            --output "AgentHarness-$(tr -d '\r\n' < VERSION)-macos-$(uname -m).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: AgentHarness-*-macos-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-files/* --verify-tag --title "Agent Harness $GITHUB_REF_NAME" --generate-notes
          fi
