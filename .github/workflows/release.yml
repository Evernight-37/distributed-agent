name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Verify source
        run: |
          python -m unittest discover -s tests -q
          node tests/test_ui_v3.js

      - name: Build portable app
        run: python build_desktop.py --output-root release

      - name: Verify clean installation
        run: python tests/cleanroom_release.py release/AgentHarness build/cleanroom

      - name: Package release
        shell: pwsh
        run: |
          $name = "AgentHarness-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -LiteralPath release/AgentHarness -DestinationPath $name -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath "$name.sha256.txt" -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "AgentHarness-$env:GITHUB_REF_NAME-windows-x64.zip"
          $notes = @'
          完整 Windows x64 便携版。解压后双击 AgentHarness.exe，并保留整个文件夹。

          这是 Agent Harness 的首个正式发行版。源码与教程已经整理，旧界面、旧启动脚本和实验性设计稿已移除；后台运行时也支持较长的 Windows 用户数据路径。应用数据保存在 %LOCALAPPDATA%\AgentHarness\data。

          Windows 可执行文件尚未代码签名，首次启动可能出现 SmartScreen 提示。
          '@
          gh release create $env:GITHUB_REF_NAME $name "$name.sha256.txt" --verify-tag --title "Agent Harness $env:GITHUB_REF_NAME" --notes $notes
