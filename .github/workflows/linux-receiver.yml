name: Verify Linux receiver

on:
  push:
    branches: [main, macos-improvements, windows-improvements]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: x64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and build dependencies
        run: python -m pip install -e . -r requirements-linux-build.txt ruff==0.14.1 pywebview==6.2.1
      - name: Verify headless source
        run: |
          python -m unittest discover -s tests -t . -q
          python src/agent_harness/linux_receiver.py --help
      - name: Package Linux receiver
        run: |
          python scripts/build_linux_receiver.py
          mkdir -p build/linux-smoke
          tar -xzf dist/AgentHarness-*-linux-*.tar.gz -C build/linux-smoke
          build/linux-smoke/AgentHarness-linux/harness --help
      - uses: actions/upload-artifact@v4
        with:
          name: AgentHarness-linux-${{ matrix.architecture }}
          path: dist/AgentHarness-*-linux-*.tar.gz*
          if-no-files-found: error
