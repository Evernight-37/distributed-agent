name: Verify macOS support

on:
  push:
    branches: [main, macos-improvements]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-macos.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Prepare standalone build Python
        run: |
          python scripts/prepare_python_runtime.py --destination "$RUNNER_TEMP/harness-python"
          "$RUNNER_TEMP/harness-python/bin/python3" -m venv "$RUNNER_TEMP/harness-build"
          echo "$RUNNER_TEMP/harness-build/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-macos.txt
          npm ci

      - name: Verify source and macOS paths
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests
          python -m unittest discover -s tests -t . -q
          npm run format:check
          npm test

      - name: Build and verify relocatable macOS app
        run: |
          python scripts/build_macos.py --output-root build/macos-release --python-runtime "$(python -c 'import sys; print(sys.base_prefix)')"
          python tests/cleanroom_release.py build/macos-release/AgentHarness.app build/cleanroom-macos
