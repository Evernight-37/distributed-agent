async function refresh(force=false){if(polling||!S.dash)return;polling=true;const epoch=S.epoch,project=S.project,page=S.page;try{const dash=await api('dashboard');let view=null;if(page==='project')view=await api('project',{id:project,visit:false});if(epoch!==S.epoch||project!==S.project||page!==S.page)return;const changed=S.dirty||JSON.stringify(dash)!==JSON.stringify(S.dash)||(view&&JSON.stringify(view)!==JSON.stringify(S.view));S.dash=dash;if(view)S.view=view;S.dirty=changed;updateProfile();const active=document.activeElement,editing=active&&['INPUT','TEXTAREA','SELECT'].includes(active.tagName);if((force||changed)&&$('modalWrap').classList.contains('hidden')&&(force||!editing)){S.dirty=false;if(S.page==='project')renderProject();else if(S.page==='dashboard')renderDashboard();else if(force||changed)await renderSettings()}}catch(e){if(force)throw e;else notify('连接暂时不可用：'+e.message,true)}finally{polling=false}}
