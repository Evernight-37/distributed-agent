<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent 群工作台</title>
  <style>
    :root { --bg:#f5f7fb; --ink:#243247; --muted:#68778b; --line:#e0e7f0; --blue:#2563eb; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px system-ui,"Microsoft YaHei",sans-serif; }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; background:var(--blue); color:white; border:0; border-radius:7px; padding:9px 13px; }
    button.secondary { color:var(--ink); background:white; border:1px solid var(--line); }
    button:disabled { opacity:.5; cursor:wait; }
    input,select,textarea { width:100%; padding:9px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); }
    textarea { min-height:85px; resize:vertical; }
    label { display:grid; gap:6px; margin:12px 0; }
    input[type=checkbox] { width:auto; }
    h1 { font-size:23px; margin:0 0 8px; } h2 { font-size:16px; margin:0 0 12px; }
    p { line-height:1.6; } pre { white-space:pre-wrap; overflow-wrap:anywhere; font:inherit; line-height:1.6; }
    .hidden { display:none!important; } .muted { color:var(--muted); } .small { font-size:12px; }
    .row { display:flex; align-items:center; gap:9px; flex-wrap:wrap; } .between { justify-content:space-between; }
    .card { padding:18px; background:white; border:1px solid var(--line); border-radius:11px; margin-bottom:15px; }
    .top { padding:16px 24px; background:white; border-bottom:1px solid var(--line); }
    .shell { display:grid; grid-template-columns:250px minmax(0,1fr); min-height:calc(100vh - 67px); }
    aside { background:white; padding:18px 14px; border-right:1px solid var(--line); }
    main { width:100%; max-width:1400px; padding:24px; margin:0 auto; }
    .project { width:100%; text-align:left; color:var(--ink); background:transparent; margin:4px 0; }
    .project.selected { color:var(--blue); background:#eff6ff; }
    .project span { display:block; margin-top:4px; }
    .tabs { display:flex; gap:8px; border-bottom:1px solid var(--line); margin:20px 0; padding-bottom:9px; }
    .tab { background:transparent; color:var(--muted); } .tab.selected { background:#dbeafe; color:#1d4ed8; }
    .columns { display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:16px; }
    .feed { height:440px; overflow:auto; display:flex; flex-direction:column; gap:12px; margin:15px 0; }
    .message { max-width:90%; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
    .message.direct { background:#faf5ff; border-color:#e9d5ff; }
    .message.mine { align-self:flex-end; background:#eff6ff; }
    .message pre { margin:7px 0 0; } .meta { font-size:12px; color:var(--muted); }
    .pill { background:#eef2f7; color:var(--muted); padding:4px 7px; border-radius:20px; font-size:12px; }
    .member { padding:12px 0; border-bottom:1px solid var(--line); }
    .member:last-child { border-bottom:0; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 15px; }
    .full { grid-column:1/-1; } details { margin:15px 0; } summary { cursor:pointer; font-weight:600; }
    #notice { color:#9a3412; min-height:24px; margin:8px 0; white-space:pre-wrap; }
    #auth { min-height:100vh; display:grid; place-items:center; }
    #auth .card { width:min(430px,calc(100% - 32px)); padding:28px; }
    dialog { width:min(620px,calc(100% - 30px)); max-height:90vh; overflow:auto; border:1px solid var(--line); border-radius:12px; padding:24px; }
    dialog::backdrop { background:#17255466; }
    .empty { padding:30px; text-align:center; color:var(--muted); }
    .task { padding:15px 0; border-bottom:1px solid var(--line); }
    @media(max-width:900px) { .shell,.columns,.grid { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } main { padding:15px; } .feed { height:380px; } }
  </style>
</head>
<body>
  <section id="auth" class="hidden">
    <form id="authForm" class="card">
      <h1>Agent 群工作台</h1>
      <p id="authHint" class="muted"></p>
      <label>用户名<input id="username" autocomplete="username" required maxlength="40"></label>
      <label>密码<input id="password" type="password" autocomplete="current-password"></label>
      <label id="inviteField" class="hidden">项目邀请代码<input id="authInvite" autocomplete="off"></label>
      <p id="authError" role="alert"></p>
      <div class="row"><button id="authSubmit" type="submit">登录</button><button id="authSwitch" type="button" class="secondary">凭邀请注册</button></div>
    </form>
  </section>
  <section id="app" class="hidden">
    <header class="top row between"><strong>Agent 群工作台</strong><div class="row"><span id="who" class="muted"></span><button id="logout" class="secondary">退出</button></div></header>
    <div class="shell">
      <aside><div class="row between"><strong>项目</strong><button id="createProject" class="secondary">＋ 新建</button></div><div id="projectList"></div><button id="joinProject" class="secondary">加入项目</button></aside>
      <main><div id="notice" role="status"></div><div id="projectView"></div></main>
    </div>
  </section>
  <dialog id="dialog"><div id="dialogBody"></div></dialog>
  <script>
    'use strict';
    const state = { csrf:null, user:null, bootstrap:false, authMode:'login', snapshot:null, view:null,
      selected:null, tab:'chat', filter:'all', loading:false, acting:false, drafts:new Map(), signature:null };
    const $ = id => document.getElementById(id);
    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }
    function button(text, handler, secondary=true) {
      const node = el('button', text, secondary?'secondary':'');
      node.type = 'button'; node.onclick = handler;
      return node;
    }
    function notice(message) {
      $('notice').textContent = message || '';
      if ($('dialog').open && state.modalNotice) state.modalNotice.textContent=message || '';
    }
    function ownerName(id) { return (state.view?.users || state.snapshot?.users || []).find(u => u.id===id)?.username || id; }
    function agentName(id) { return state.view?.members.find(a => a.id===id)?.name || id; }
    function ownAgent(id) { return state.view?.members.find(a => a.id===id)?.owner_id===state.user?.id; }
    function groupOwner() { return state.view?.project.owner_id===state.user?.id; }
    function date(value) { return value ? new Date(Number(value)*1000).toLocaleString() : ''; }
    async function api(path, options={}) {
      const headers = { Accept:'application/json', ...(options.headers || {}) };
      if (options.body) { headers['Content-Type']='application/json'; options.body=JSON.stringify(options.body); }
      if (state.csrf) headers['X-CSRF-Token']=state.csrf;
      const response = await fetch(path, { ...options, headers });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      if (data.csrf) state.csrf=data.csrf;
      return data;
    }
    async function action(name, data={}) {
      return api('/api/action', { method:'POST', body:{action:name,...data} });
    }
    async function run(name, data={}, success='已完成') {
      if (state.acting) return false;
      state.acting=true;
      try { const result=await action(name,data); notice(success); state.signature=null; await refresh(true); return result; }
      catch(error) { notice(error.message); return false; }
      finally { state.acting=false; }
    }
    function authView() {
      const bootstrap=state.bootstrap, register=state.authMode==='register';
      $('auth').classList.remove('hidden'); $('app').classList.add('hidden');
      $('authHint').textContent=bootstrap ? '首次使用：创建你的管理账户。密码不限制长度，也可以留空；仅提交给本机服务。' : register ? '使用项目群主提供的邀请代码创建账户。密码不限制长度，也可以留空。' : '登录后查看项目群聊、私聊审计和自己的 agent 设置。';
      $('authSubmit').textContent=bootstrap?'创建账户':register?'注册并加入':'登录';
      $('authSwitch').classList.toggle('hidden',bootstrap);
      $('authSwitch').textContent=register?'已有账户，去登录':'凭邀请注册';
      $('inviteField').classList.toggle('hidden',!register || bootstrap);
      $('password').autocomplete=register||bootstrap?'new-password':'current-password';
    }
    async function initialize() {
      try {
        const session=await api('/api/session');
        state.user=session.user; state.bootstrap=session.bootstrap_required;
        if (!state.user) return authView();
        $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
        $('who').textContent=state.user.username;
        await refresh(true);
      } catch(error) { $('authError').textContent=error.message; authView(); }
    }
    $('authSwitch').onclick=()=>{ state.authMode=state.authMode==='login'?'register':'login'; $('authError').textContent=''; authView(); };
    $('authForm').onsubmit=async event=>{
      event.preventDefault(); $('authSubmit').disabled=true;
      try {
        const name=state.bootstrap?'bootstrap':state.authMode==='register'?'register-user':'login';
        const result=await action(name,{username:$('username').value.trim(),password:$('password').value,invite:$('authInvite').value.trim()});
        state.user=result.user; $('password').value=''; $('authInvite').value=''; await initialize();
      } catch(error) { $('authError').textContent=error.message; }
      finally { $('authSubmit').disabled=false; }
    };
    $('logout').onclick=async()=>{
      try { await action('logout'); state.user=null; state.view=null; state.selected=null; state.snapshot=null; state.drafts.clear(); $('projectView').replaceChildren(); await initialize(); }
      catch(error) { notice(error.message); }
    };
    function editing() {
      const node=document.activeElement;
      return ['INPUT','TEXTAREA','SELECT'].includes(node?.tagName) || $('dialog').open;
    }
    async function refresh(force=false) {
      if (state.loading || !state.user || (!force && editing())) return;
      state.loading=true;
      try {
        state.snapshot=await api('/api/snapshot');
        if (!state.snapshot.projects.some(p=>p.id===state.selected)) state.selected=state.snapshot.projects[0]?.id || null;
        state.view=state.selected ? await api('/api/project?id='+encodeURIComponent(state.selected)) : null;
        renderProjects();
        const signature=JSON.stringify([state.view,state.tab,state.filter]);
        // Keep controls and scroll position intact while the server state is unchanged.
        if (signature!==state.signature) { state.signature=signature; render(); }
      } catch(error) { notice(error.message); }
      finally { state.loading=false; }
    }
    async function selectProject(id) { state.selected=id; state.signature=null; await refresh(true); }
    function renderProjects() {
      const list=$('projectList'); list.replaceChildren();
      for (const p of state.snapshot.projects) {
        const item=button(p.name,()=>selectProject(p.id)); item.className='project'+(p.id===state.selected?' selected':'');
        item.append(el('span',p.admin_agent_id?'管理员已设置':'等待设置管理员','small muted')); list.append(item);
      }
      if (!state.snapshot.projects.length) list.append(el('p','创建或加入一个项目开始协作。','muted'));
    }
    function render() {
      const main=$('projectView'); main.replaceChildren();
      if (!state.view) { main.append(el('div','项目就是 agent 工作群。先创建项目，再接入你拥有的机器上的 agent。','card empty')); return; }
      const p=state.view.project, header=el('div',undefined,'row between'), title=el('div');
      title.append(el('h1',p.name),el('div',`群主：${ownerName(p.owner_id)} · 管理员：${p.admin_agent_name || '未设置'} · 剩余 ${state.view.budget_remaining} 轮${p.paused?' · 已暂停':''}`,'small muted'));
      header.append(title); main.append(header);
      const tabs=el('nav',undefined,'tabs');
      for (const [id,label] of [['chat','群聊'],['tasks','任务与后台作业'],['members','成员与设置']]) {
        const b=button(label,()=>{state.tab=id;state.signature=null;render();}); b.className='tab'+(state.tab===id?' selected':''); tabs.append(b);
      }
      main.append(tabs);
      if (state.tab==='chat') renderChat(main);
      if (state.tab==='tasks') renderTasks(main);
      if (state.tab==='members') renderMembers(main);
    }
    function memberRow(agent, controls=false) {
      const row=el('div',undefined,'member');
      const top=el('div',undefined,'row between'); top.append(el('strong',agent.name),el('span',agent.role==='admin'?'管理员':'协作者','pill')); row.append(top);
      row.append(el('p',`${ownerName(agent.owner_id)} · ${agent.node} · ${agent.model} / ${agent.effort} · ${agent.status}`,'small muted'));
      if (controls && ownAgent(agent.id)) row.append(button('我的 agent 设置',()=>agentSettings(agent)));
      return row;
    }
    function renderChat(main) {
      const columns=el('div',undefined,'columns'), card=el('section',undefined,'card'), side=el('section',undefined,'card');
      const bar=el('div',undefined,'row between'); bar.append(el('h2','消息'));
      const filter=choice([['all','全部消息'],['group','群聊'],['direct','私聊审计']]); filter.style.width='auto'; filter.value=state.filter;
      filter.onchange=()=>{ state.filter=filter.value; render(); }; bar.append(filter); card.append(bar);
      card.append(el('div','项目内的人可以审计所有消息；agent 仅收到群聊及与自己有关的私聊。','small muted'));
      const feed=el('div',undefined,'feed'); feed.id='messageFeed';
      for (const message of state.view.messages.filter(m=>state.filter==='all'||m.channel===state.filter)) {
        const box=el('article',undefined,'message '+message.channel+(message.sender_id===state.user.id?' mine':''));
        const route=message.channel==='direct'?` → ${message.recipient_name || message.recipient_id}（私聊）`:' · 群聊';
        box.append(el('div',`${message.sender_name}${route} · ${date(message.created_at)}`,'meta'),el('pre',message.body)); feed.append(box);
      }
      if (!feed.children.length) feed.append(el('div','还没有消息','empty')); card.append(feed);
      const draft=state.drafts.get(state.selected)||{body:'',recipient:''};
      const recipients=[['','发送到群聊'],...state.view.members.map(a=>[a.id,'私聊：'+a.name]),...state.view.users.filter(u=>u.id!==state.user.id).map(u=>[u.id,'私聊：'+u.username])];
      const to=choice(recipients); to.value=draft.recipient; const body=el('textarea'); body.placeholder='向管理员说明目标，或给指定成员留言…'; body.value=draft.body;
      const save=()=>state.drafts.set(state.selected,{body:body.value,recipient:to.value}); body.oninput=save; to.onchange=save;
      const send=button('发送',async()=>{
        if (!body.value.trim()) return;
        send.disabled=true;
        try { await action('message',{project:state.selected,body:body.value.trim(),recipient_id:to.value||null}); state.drafts.delete(state.selected); state.signature=null; notice('消息已送达；运行中的 agent 会在后续轮次读取。'); await refresh(true); }
        catch(error) { notice(error.message); } finally {send.disabled=false;}
      },false);
      card.append(to,body,send); side.append(el('h2','群内 agent'));
      state.view.members.forEach(a=>side.append(memberRow(a)));
      if (!state.view.members.length) side.append(el('p','在“成员与设置”中接入 agent。','muted'));
      columns.append(card,side); main.append(columns); feed.scrollTop=feed.scrollHeight;
    }
    function choice(options) {
      const node=el('select');
      options.forEach(([value,text])=>{const option=el('option',text);option.value=value;node.append(option);});
      return node;
    }
    function field(form,label,name,value='',kind='input',options=null) {
      const wrap=el('label',label);
      const control=options?choice(options):el(kind==='textarea'?'textarea':'input');
      if (kind==='number') control.type='number';
      control.name=name; control.value=value; wrap.append(control); form.append(wrap); return control;
    }
    function formValues(form) { return Object.fromEntries(new FormData(form)); }
    function modal(title,build) {
      const body=$('dialogBody'); body.replaceChildren(); body.append(el('h2',title));
      const form=el('form'); build(form); state.modalNotice=el('p'); state.modalNotice.setAttribute?.('role','alert'); form.append(state.modalNotice); const buttons=el('div',undefined,'row');
      const submit=el('button','保存'); submit.type='submit'; buttons.append(submit,button('关闭',()=>$('dialog').close())); form.append(buttons); body.append(form);
      $('dialog').showModal(); return form;
    }
    function simpleModal(title,label,name,op) {
      const form=modal(title,f=>{field(f,label,name).required=true;});
      form.onsubmit=async e=>{e.preventDefault();const result=await run(op,formValues(form));if(result)$('dialog').close();};
    }
    $('createProject').onclick=()=>simpleModal('创建项目','项目名称','name','create-project');
    $('joinProject').onclick=()=>simpleModal('加入项目','群主提供的邀请代码','invite','join-project');
    function renderMembers(main) {
      const card=el('section',undefined,'card'); card.append(el('h2','Agent 成员'));
      state.view.members.forEach(a=>card.append(memberRow(a,true)));
      card.append(button('接入我的 agent',addAgent)); main.append(card);
      const people=el('section',undefined,'card'); people.append(el('h2','人类成员'));
      state.view.users.forEach(u=>people.append(el('p',u.username+(u.id===state.view.project.owner_id?' · 群主':'')))); main.append(people);
      if (groupOwner()) {
        const settings=el('section',undefined,'card'); settings.append(el('h2','群主控制'));
        const actions=el('div',undefined,'row');
        actions.append(button('设置管理员',()=>{
          const form=modal('设置管理员',f=>field(f,'管理员 agent','agent',state.view.project.admin_agent_id||'',null,state.view.members.map(a=>[a.id,a.name])));
          form.onsubmit=async e=>{e.preventDefault();if(await run('set-admin',{project:state.selected,...formValues(form)}))$('dialog').close();};
        }));
        actions.append(button('生成邀请',async()=>{
          try {const result=await action('invite',{project:state.selected}); const form=modal('项目邀请',f=>{f.append(el('p','邀请代码仅使用一次。请自行分享给项目成员。'));const input=field(f,'邀请代码','invite',result.invite||result.token||'');input.readOnly=true;});form.onsubmit=e=>{e.preventDefault();$('dialog').close();};}
          catch(error){notice(error.message);}
        }));
        actions.append(button(state.view.project.paused?'恢复协作':'暂停协作',()=>run('pause-project',{project:state.selected,paused:!state.view.project.paused},'设置已更新；暂停不会停止已运行的任务。')));
        actions.append(button('补充协作轮次',()=>{
          const form=modal('协作轮次上限',f=>{const i=field(f,'新的剩余额度（1–200）','budget',20,'number');i.min=1;i.max=200;});
          form.onsubmit=async e=>{e.preventDefault();if(await run('renew-budget',{project:state.selected,budget:Number(formValues(form).budget)}))$('dialog').close();};
        })); settings.append(actions,el('p','管理员安排分工；机器所有者决定模型、思考强度和后台命令。','small muted')); main.append(settings);
      }
      main.append(el('p','机器连接由服务维护者通过 group_cli.py 登记并绑定所有者。这里仅显示你拥有的机器，不复制任何登录凭据。','small muted'));
    }
    function modelFields(form,agent={model:'',effort:'medium',timeout:120}) {
      field(form,'模型（明确填写 CLI 支持的模型名称）','model',agent.model).required=true;
      field(form,'思考强度','effort',agent.effort,null,['low','medium','high','xhigh','max','ultra'].map(v=>[v,v]));
      const timeout=field(form,'每轮超时（秒）','timeout',agent.timeout,'number'); timeout.min=30; timeout.max=86400; timeout.required=true;
    }
    function addAgent() {
      if (!state.snapshot.nodes.length) return notice('你还没有绑定机器。请由服务维护者先登记连接并把节点绑定给你的账户。');
      const form=modal('接入我的 agent',f=>{
        field(f,'Agent 名称','name').required=true;
        field(f,'我的机器','node',state.snapshot.nodes[0].name,null,state.snapshot.nodes.map(n=>[n.name,n.name]));
        field(f,'已登记的后端项目 ID','backend_project').required=true;
        f.append(el('p','每个 agent 使用独立的后端项目会话；后端项目需要先明确登记目录和工作树。','small muted')); modelFields(f);
      });
      form.onsubmit=async e=>{e.preventDefault();const values=formValues(form);if(await run('add-agent',{project:state.selected,...values,timeout:Number(values.timeout)}))$('dialog').close();};
    }
    function agentSettings(agent) {
      const form=modal('我的 agent：'+agent.name,f=>{
        modelFields(f,agent); const label=el('label'),enabled=el('input');enabled.type='checkbox';enabled.name='enabled';enabled.checked=Boolean(agent.enabled);label.append(enabled,el('span','允许接收新任务'));f.append(label);
        const details=el('details');details.append(el('summary','后台命令模板（高级）'));details.append(el('p','只有你可以批准命令模板。Agent 仅能请求模板名称，不能提供任意命令。argv 的首项须为机器上的绝对可执行文件路径。','small muted'));
        const editor=el('textarea');editor.placeholder='{"check":{"argv":["C:\\path\\python.exe","check.py"]}}';details.append(editor);
        details.append(button('保存命令模板',async()=>{try{const templates=JSON.parse(editor.value);await action('templates',{agent:agent.id,templates});notice('模板已保存');}catch(error){notice(error.message);}}));f.append(details);
      });
      form.onsubmit=async e=>{e.preventDefault();const values=formValues(form);if(await run('configure-agent',{agent:agent.id,model:values.model,effort:values.effort,timeout:Number(values.timeout),enabled:values.enabled==='on'}))$('dialog').close();};
    }
    function renderTasks(main) {
      const card=el('section',undefined,'card'); const bar=el('div',undefined,'row between');bar.append(el('h2','Agent 任务'),button('明确派发任务',newTask));card.append(bar);
      for (const task of state.view.tasks) {
        const row=el('div',undefined,'task'),top=el('div',undefined,'row between');top.append(el('strong',task.title),el('span',task.state,'pill'));row.append(top,el('p',`${agentName(task.agent_id)} · ${date(task.created_at)}`,'small muted'));
        if (task.error) row.append(el('pre',task.error));
        if (task.report) {const details=el('details');details.append(el('summary','查看报告'),el('pre',task.report));row.append(details);}
        if (ownAgent(task.agent_id)&&['queued','starting','running','unknown'].includes(task.state)) row.append(button('取消我的 agent 任务',()=>run('cancel-task',{task:task.id},'已提交取消请求')));
        card.append(row);
      }
      if (!state.view.tasks.length) card.append(el('p','管理员会把讨论和分工记录为任务。','muted')); main.append(card);
      const jobs=el('section',undefined,'card'); jobs.append(el('h2','独立后台作业'),el('p','长命令在独立进程中运行；agent 等待完成消息，不持续占用会话。机器所有者批准自己的命令请求。','muted small'));
      for (const job of state.view.executions) {
        const row=el('div',undefined,'task');row.append(el('strong',job.template),el('p',`${agentName(job.agent_id)} · ${job.state}`));
        if (job.result) {const details=el('details');details.append(el('summary','查看输出'),el('pre',typeof job.result==='string'?job.result:JSON.stringify(job.result,null,2)));row.append(details);}
        if (ownAgent(job.agent_id)) {
          if (job.state==='awaiting_owner') row.append(button('批准运行',()=>run('execution-approve',{execution:job.id})));
          if (['awaiting_owner','approved','starting','running','unknown'].includes(job.state)) row.append(button('取消作业',()=>run('execution-cancel',{execution:job.id})));
        }
        jobs.append(row);
      }
      if (!state.view.executions.length) jobs.append(el('p','暂无后台作业。','muted'));main.append(jobs);
    }
    function newTask() {
      const agents=state.view.members.filter(a=>a.enabled&&a.owner_id===state.user.id);
      if (!agents.length) return notice('先接入一个可用 agent。');
      const form=modal('派发有明确验收条件的任务',f=>{
        field(f,'接收 agent','agent',agents[0].id,null,agents.map(a=>[a.id,a.name]));
        field(f,'阶段','stage','discuss',null,[['discuss','讨论'],['review','审查'],['implement','实现（需已登记的独立工作树）']]);
        field(f,'任务标题','title').required=true;
        field(f,'目标、上下文和禁止事项','instructions','','textarea').required=true;
        field(f,'允许修改的文件／责任范围','allowed_files','','textarea');
        field(f,'验收条件','acceptance','','textarea').required=true;
        field(f,'验证方法／命令','validation','','textarea').required=true;
      });
      form.onsubmit=async e=>{e.preventDefault();if(await run('task',{project:state.selected,...formValues(form)},'任务已加入队列'))$('dialog').close();};
    }
    // The browser polls server state only. Idle agents do not make model requests.
    setInterval(()=>refresh().catch(error=>notice(error.message)),4000);
    initialize();
  </script>
</body>
</html>
