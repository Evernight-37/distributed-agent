<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Harness 控制台</title>
<style>
:root{color-scheme:dark;--bg:#10141b;--panel:#181e27;--line:#2b3544;--text:#e8edf4;--muted:#9da9b8;--accent:#67b7ff;--ok:#55d69a;--warn:#f6c766;--bad:#ff7f8e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:14px 0 8px}.sub{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 67px)}aside{border-right:1px solid var(--line);padding:18px;overflow:auto}main{padding:22px;max-width:1300px;width:100%;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}label{color:var(--muted);font-size:12px}input,select,textarea,button{font:inherit}input,select,textarea{background:#0f141b;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px}textarea{min-height:70px;resize:vertical}button{background:#234b6e;color:white;border:1px solid #37698f;border-radius:6px;padding:8px 12px;cursor:pointer}button:hover{background:#2e638d}button.secondary{background:transparent;border-color:var(--line);color:var(--text)}button.danger{border-color:#88414c;background:#552832}.hidden{display:none!important}.list{display:flex;flex-direction:column;gap:7px}.item{border:1px solid var(--line);border-radius:7px;padding:9px;cursor:pointer}.item:hover,.item.selected{border-color:var(--accent);background:#1c2937}.status{display:inline-block;border-radius:10px;padding:2px 7px;font-size:11px;background:#334052;color:var(--muted)}.status.ok{background:#173e33;color:var(--ok)}.status.warn{background:#51421e;color:var(--warn)}.status.bad{background:#51232d;color:var(--bad)}pre{white-space:pre-wrap;overflow:auto;max-height:330px;background:#0c1016;padding:10px;border-radius:6px;color:#c6d0dc}.notice{color:var(--warn);min-height:20px}.muted{color:var(--muted)}.wide{grid-column:1/-1}@media(max-width:850px){.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>Agent Harness 控制台</h1><div class="sub">节点、项目、任务与共享记忆</div></div><div id="health" class="status">连接中</div></header>
<div class="layout"><aside>
<section class="card"><h2>节点</h2><div id="nodes" class="list"></div></section>
<section class="card"><h2>项目</h2><div id="projects" class="list"></div></section>
</aside><main>
<div id="error" class="notice"></div>
<section class="card"><div class="row between"><h2>任务</h2><button id="refresh" class="secondary">刷新</button></div><div id="jobs" class="list"></div></section>
<section id="detail" class="card"><h2>任务详情</h2><div class="muted">选择一个任务查看报告和操作。</div></section>
<section class="card"><h2>提交任务</h2><div class="grid"><div class="field"><label for="taskProject">项目</label><select id="taskProject"></select></div><div class="field"><label for="taskStage">阶段</label><select id="taskStage"><option value="discuss">讨论</option><option value="review">审查</option><option value="implement">实现</option></select></div><div class="field wide"><label for="taskText">任务说明</label><textarea id="taskText" placeholder="说明目标、上下文和需要代理完成的工作"></textarea></div><div class="field"><label for="allowed">允许文件或范围</label><input id="allowed" placeholder="例如 src/ 与 tests/"></div><div class="field"><label for="acceptance">验收标准</label><input id="acceptance" placeholder="完成后应满足什么条件"></div><div class="field"><label for="validation">验证命令</label><input id="validation" placeholder="例如 python -m pytest"></div></div><button id="submit">提交任务</button></section>
<section class="card"><h2>项目设置</h2><div class="grid"><div class="field"><label for="cfgProject">项目</label><select id="cfgProject"></select></div><div class="field"><label for="cfgModel">模型</label><input id="cfgModel" placeholder="例如 gpt-5.6-sol"></div><div class="field"><label for="cfgEffort">思考强度</label><select id="cfgEffort"><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option><option>ultra</option></select></div><div class="field"><label for="cfgTimeout">超时（秒）</label><input id="cfgTimeout" type="number" min="30" max="86400" value="1800"></div></div><button id="configure">保存设置</button></section>
<section class="card"><h2>注册项目</h2><div class="grid"><div class="field"><label for="regName">名称</label><input id="regName"></div><div class="field"><label for="regNode">节点</label><select id="regNode"></select></div><div class="field"><label for="regLocal">主控项目路径</label><input id="regLocal"></div><div class="field"><label for="regRemote">远端项目路径</label><input id="regRemote"></div><div class="field"><label for="regModel">模型</label><input id="regModel" placeholder="gpt-5.6-sol"></div><div class="field"><label for="regEffort">思考强度</label><select id="regEffort"><option>low</option><option selected>medium</option><option>high</option><option>xhigh</option><option>max</option><option>ultra</option></select></div><div class="field"><label for="regTimeout">超时（秒）</label><input id="regTimeout" type="number" min="30" max="86400" value="1800"></div></div><button id="register">注册项目</button></section>
<section class="card"><h2>下一轮消息</h2><div class="field"><label for="msgProject">项目</label><select id="msgProject"></select></div><div class="field"><label for="msgText">给远端代理的消息</label><textarea id="msgText" placeholder="消息会在它下一次提交任务时送达"></textarea></div><button id="message">加入队列</button></section>
<section class="card"><h2>共享记忆</h2><div class="grid"><div class="field"><label for="memProject">项目</label><select id="memProject"></select></div><div class="field"><label for="memKind">类型</label><select id="memKind"><option value="fact">事实</option><option value="decision">决定</option><option value="question">问题</option></select></div><div class="field wide"><label for="memText">内容</label><textarea id="memText"></textarea></div><div class="field wide"><label for="memEvidence">证据</label><input id="memEvidence" placeholder="文件、命令或任务 ID"></div></div><button id="remember">保存记忆</button></section>
</main></div>
<script>
(()=>{const $=id=>document.getElementById(id), state={snapshot:null,selected:null,token:null,busy:false,detailBusy:false,configProject:null};
const text=(el,v)=>{el.textContent=v==null?'':String(v)}; const escStatus=s=>/complete|accepted|running|queued|needs_review/i.test(String(s))?'ok':/fail|error|cancel|timeout/i.test(String(s))?'bad':'warn';
function error(e){text($('error'),e&&e.message?e.message:String(e));setTimeout(()=>text($('error'),''),6000)}
async function api(path,opt={}){const o={...opt,headers:{Accept:'application/json',...(opt.headers||{})}};if(o.body&&typeof o.body!=='string'){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}if(path!='/api/session'&&state.token)o.headers['X-CSRF-Token']=state.token;const r=await fetch(path,o);let d;try{d=await r.json()}catch(_){d={}}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
async function session(){try{const d=await api('/api/session');state.token=d.token||null}catch(e){error(e)}}
function fill(sel,items,value){const old=sel.value;while(sel.firstChild)sel.removeChild(sel.firstChild);(items||[]).forEach(x=>{const o=document.createElement('option');o.value=x.value||x.name;o.textContent=x.label||x.name;sel.appendChild(o)});sel.value=value||old||sel.firstChild?.value||''}
function render(d){state.snapshot=d; text($('health'),'已连接');$('health').className='status ok';const nodes=d.nodes||[], projects=d.projects||[], jobs=d.jobs||[];const nl=$('nodes');while(nl.firstChild)nl.removeChild(nl.firstChild);nodes.forEach(n=>{const x=document.createElement('div');x.className='item';text(x,`${n.name||''}  ${n.host||''}`);const sm=document.createElement('div');sm.className='sub';text(sm,`${n.user||''} · ${n.platform||''}`);x.appendChild(sm);const b=document.createElement('button');b.className='secondary';text(b,'探测');b.onclick=ev=>{ev.stopPropagation();action('probe',{node:n.name})};x.appendChild(b);nl.appendChild(x)});const pl=$('projects');while(pl.firstChild)pl.removeChild(pl.firstChild);projects.forEach(p=>{const x=document.createElement('div');x.className='item';text(x,p.name);const sm=document.createElement('div');sm.className='sub';text(sm,`${p.node||''} · ${p.model||''} · ${p.effort||''}`);x.appendChild(sm);x.onclick=()=>{['taskProject','cfgProject','msgProject','memProject'].forEach(id=>$(id).value=p.name);$('cfgModel').value=p.model||'';$('cfgEffort').value=p.effort||'medium';$('cfgTimeout').value=p.timeout||1800};pl.appendChild(x)});const opts=projects.map(p=>({name:p.name}));['taskProject','cfgProject','msgProject','memProject'].forEach(id=>fill($(id),opts));fill($('regNode'),nodes.map(n=>({name:n.name})));
if(!state.configProject&&projects.length){loadConfig(projects[0].name)}const jl=$('jobs');while(jl.firstChild)jl.removeChild(jl.firstChild);jobs.slice().reverse().forEach(j=>{const x=document.createElement('div');x.className='item'+(state.selected===j.job?' selected':'');x.onclick=()=>selectJob(j.job);const top=document.createElement('div');text(top,`${j.job||''} · ${j.project||''}`);const st=document.createElement('span');st.className='status '+escStatus(j.status||j.state);text(st,j.status||j.state||'unknown');top.appendChild(document.createTextNode(' '));top.appendChild(st);x.appendChild(top);const sm=document.createElement('div');sm.className='sub';text(sm,`${j.stage||''} · ${j.started_at||j.created_at||''}`);x.appendChild(sm);jl.appendChild(x)});}
async function refresh(){if(state.busy)return;state.busy=true;try{const d=await api('/api/snapshot');render(d);const j=(d.jobs||[]).find(x=>(x.job||x.id)===state.selected);if(state.selected&&j&&/^(starting|running|queued)$/i.test(j.status||j.state||''))await selectJob(state.selected,true)}catch(e){$('health').className='status bad';text($('health'),'连接失败');error(e)}finally{state.busy=false}}
async function selectJob(id,quiet){if(state.detailBusy)return;state.selected=id;state.detailBusy=true;try{const d=await api('/api/job?id='+encodeURIComponent(id));const el=$('detail');while(el.firstChild)el.removeChild(el.firstChild);const h=document.createElement('h2');text(h,'任务详情 '+id);el.appendChild(h);const meta=document.createElement('div');meta.className='sub';text(meta,`${d.status||d.state||''} · ${d.project||''}`);el.appendChild(meta);if(d.report){const h3=document.createElement('h3');text(h3,'报告');el.appendChild(h3);const pre=document.createElement('pre');text(pre,d.report);el.appendChild(pre)}if(d.events||d.recent_events){d.events=d.events||d.recent_events;const h3=document.createElement('h3');text(h3,'事件');el.appendChild(h3);const pre=document.createElement('pre');text(pre,typeof d.events==='string'?d.events:JSON.stringify(d.events,null,2));el.appendChild(pre)}const act=document.createElement('div');act.className='row';const cancel=document.createElement('button');cancel.className='danger';text(cancel,'取消任务');cancel.onclick=()=>action('cancel',{job:id});act.appendChild(cancel);const review=document.createElement('select');['accepted','changes_requested'].forEach(v=>{const o=document.createElement('option');o.value=v;text(o,v);review.appendChild(o)});const ev=document.createElement('input');ev.placeholder='审查证据';const rb=document.createElement('button');text(rb,'提交审查');rb.onclick=()=>action('review',{job:id,verdict:review.value,evidence:ev.value});act.append(review,ev,rb);el.appendChild(act)}catch(e){if(!quiet)error(e)}finally{state.detailBusy=false}}async function action(a,data){try{const r=await api('/api/action',{method:'POST',body:{action:a,...data}});text($('error'),r.message||JSON.stringify(r));setTimeout(()=>text($('error'),''),3500);const d=await api('/api/snapshot');render(d);if(r.job||data?.job){state.selected=r.job||data.job;await selectJob(state.selected,false)}}catch(e){error(e)}}function loadConfig(name){const p=(state.snapshot?.projects||[]).find(x=>x.name===name);if(!p)return;$('cfgProject').value=p.name;$('cfgModel').value=p.model||'';$('cfgEffort').value=p.effort||'medium';$('cfgTimeout').value=p.timeout||1800;state.configProject=p.name}
function val(id){return $(id).value.trim()}
$('refresh').onclick=refresh;$('submit').onclick=()=>action('submit',{project:val('taskProject'),task:val('taskText'),stage:val('taskStage'),allowed_files:val('allowed'),acceptance:val('acceptance'),validation:val('validation')});$('configure').onclick=()=>action('configure',{project:val('cfgProject'),model:val('cfgModel'),effort:val('cfgEffort'),timeout:Number(val('cfgTimeout'))});$('register').onclick=()=>action('register',{name:val('regName'),node:val('regNode'),local_path:val('regLocal'),remote_path:val('regRemote'),model:val('regModel'),effort:val('regEffort'),timeout:Number(val('regTimeout'))});$('message').onclick=()=>action('message',{project:val('msgProject'),text:val('msgText')});$('remember').onclick=()=>action('remember',{project:val('memProject'),kind:val('memKind'),text:val('memText'),evidence:val('memEvidence')});session().then(refresh);setInterval(refresh,5000)})();
</script></body></html>
