:root{--bg:#f3f5f8;--paper:#fff;--ink:#202c40;--muted:#788498;--line:#e5e9f0;--brand:#5266df;--soft:#edf0ff;--green:#28947c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:9px 14px}button:hover{border-color:#b4bce9;background:#f8f9ff}button:disabled{cursor:default;opacity:.5}button.primary{background:var(--brand);color:white;border-color:var(--brand)}button.link{border:0;color:var(--brand);background:transparent;padding:3px}input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--paper);color:var(--ink)}input:focus,select:focus{outline:2px solid #cbd2ff}h1,h2,h3,p{margin-top:0}h1{font-size:27px;letter-spacing:-.5px;margin-bottom:5px}h2{font-size:18px;margin-bottom:0}h3{font-size:15px;margin-bottom:7px}.muted{color:var(--muted)}.small{font-size:12px}.banner{height:35px;background:#fff6dc;color:#85682c;text-align:center;padding:7px 14px;font-size:12px;position:sticky;top:0;z-index:20}.layout{display:flex;min-height:calc(100vh - 35px)}.sidebar{width:222px;flex-shrink:0;background:var(--paper);border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column}.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:38px}.logo-icon{width:32px;height:32px;border-radius:10px;background:var(--brand);color:white;display:grid;place-items:center}.profile{display:flex;align-items:center;gap:11px;margin-bottom:27px}.avatar{width:42px;height:42px;border-radius:50%;background:#eae9fc;color:#655dc0;display:grid;place-items:center;font-weight:700}.nav{width:100%;text-align:left;margin-bottom:8px;border:0;background:transparent;padding:12px;color:var(--muted)}.nav.active{background:var(--soft);color:var(--brand);font-weight:600}.sidebar-foot{margin-top:auto dark{--bg:#161e2b;--paper:#202b3a;--ink:#e8edf5;--muted:#a0adc1;--line:#354153;--soft:#303958}.dark .note,.dark .bot,.dark .device-icon{background:#2a3547}.dark input,.dark select{color-scheme:dark}@media(max-width:1000px){main{padding:28px 25px}.sidebar{width:185px}.columns{gap:18px}.project-layout{grid-template-columns:1fr}.messages{height:350px}}@media(max-width:760px){.banner{height:auto;font-size:11px}.layout{display:block}.sidebar{width:100%;padding:14px 20px;display:flex;flex-direction:row;align-items:center;gap:12px;border-right:0;border-bottom:1px solid var(--line)}.logo{margin:0;font-size:14px}.profile,.sidebar-foot{display:none}.nav{width:auto;margin:0;padding:8px 12px}.columns{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px}.login{width:calc(100% - 35px);margin:7vh auto;padding:28px}main{padding:24px 20px}h1{font-size:23px}}

<div class="banner">交互设计稿 · 示例数据，不连接真实账户或运行 agent</div>
<div id="login" class="login"><div class="logo"><span class="logo-icon">◎</span> 协作工作台</div><h1>你的员工与项目，在一起。</h1><p class="muted">一个账户，连接你自己的多台电脑。</p><label class="label" for="sampleName">示例账户名称</label><input id="sampleName" value="Evernight" maxlength="30" autocomplete="off"><button id="loginButton" class="primary">进入示例工作台 →</button><div class="note">这是交互设计预览，不接受真实密码。正式版将在这里提供注册、登录和新增设备授权。</div></div>
<div id="app" class="layout hidden"><aside class="sidebar"><div class="logo"><span class="logo-icon">◎</span> 协作工作台</div><div class="profile"><span class="avatar">E</span><div><strong id="profileName">Evernight</strong><div class="muted small">同一账户 · 2 台设备</div></div></div><button class="nav active" id="dashboardNav">▦　控制台</button><button class="nav" id="settingsNav">⚙　设置</button><div class="sidebar-foot">当前设备：5090 工作站<br>账户示例 · 所有操作仅存在内存<br><button id="logout" class="link">返回登录预览</button></div></aside><main id="content"></main></div>
<div id="modalWrap" class="modal-wrap hidden"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="row"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="关闭">×</button></div><div id="modalBody"></div><div id="modalActions" class="modal-actions"></div></div></div><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);let currentUser='Evernight',selectedProject=null,memberView=false,machineFilter='all',toastTimer;
const agents=[{id:'a1',name:'规划师',model:'gpt-5.6-sol',effort:'high',machine:'5090 工作站',status:'空闲',path:'D:\\projects\\research',enabled:true},{id:'a2',name:'实验员',model:'gpt-5.6-sol',effort:'medium',machine:'实验室 4090',status:'工作中',path:'D:\\experiments\\research',enabled:true},{id:'a3',name:'审阅员',model:'gpt-5.6-sol',effort:'high',machine:'实验室 4090',status:'离线',path:'D:\\projects\\review',enabled:true}];
const projects=[{id:'p1',name:'分布式协作工作台',last:'今天 14:32',admin:'a1',assigned:['a1','a2'],messages:[{who:'你',text:'我们先讨论交互，再决定实现分工。',channel:'群聊'},{who:'规划师',text:'我负责整理方案；实验员评估本机运行流程。项目文件保留在各自机器，按分工交换成果。',channel:'群聊'},{who:'实验员',text:'收到。我会先验证流程，再把结果带回群聊。',channel:'群聊'},{who:'规划师 → 实验员',text:'请优先检查设备离线后恢复任务的提示。',channel:'私聊 · 人类可见'}]},{id:'p2',name:'实验结果分析',last:'昨天 19:08',admin:'a2',assigned:['a2'],messages:[]}];
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function append(parent,...children){children.forEach(n=>parent.append(n));return parent}function button(text,fn,cls=''){const n=el('button',cls,text);n.onclick=fn;return n}
function notify(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function closeModal(){$('modalWrap').classList.add('hidden')}function modal(title,build){$('modalTitle').textContent=title;$('modalBody').replaceChildren();$('modalActions').replaceChildren();build($('modalBody'),$('modalActions'));$('modalWrap').classList.remove('hidden');const input=$('modalBody').querySelector('input,select');if(input)input.focus()}
let fieldCounter=0;function field(parent,label,value,options){const caption=el('label','label',label);const n=el(options?'select':'input');n.id='design-field-'+(++fieldCounter);caption.htmlFor=n.id;parent.append(caption);if(options)options.forEach(v=>{const o=el('option','',v);o.value=v;n.append(o)});n.value=value;parent.append(n);return n}
function pageHeader(title,subtitle){const n=el('div','top');const txt=el('div');append(txt,el('h1','',title),el('div','muted',subtitle));n.append(txt);return n}
function nav(page){$('dashboardNav').classList.toggle('active',page==='dashboard');$('settingsNav').classList.toggle('active',page==='settings')}
function agentSettings(agent){modal('员工设置 · '+agent.name,(body,actions)=>{const name=field(body,'员工名称',agent.name);name.maxLength=30;const model=field(body,'模型',agent.model,['gpt-5.6-sol','gpt-6.1-sol','gpt-6-luna']);const effort=field(body,'思考强度',agent.effort,['low','medium','high','xhigh','max','ultra']);append(body,el('label','label','所在机器'),el('div','muted',agent.machine));const path=field(body,'本机工作目录',agent.path);path.readOnly=true;body.append(button('选择文件夹…',()=>{path.value=agent.machine==='5090 工作站'?'D:\\projects\\sample':'D:\\experiments\\sample';notify('示例：已选择文件夹，未访问磁盘')}));const enabled=el('input','check');enabled.type='checkbox';enabled.checked=agent.enabled;const line=el('label','label');append(line,enabled,document.createTextNode(' 允许接收项目任务'));body.append(line);body.append(el('div','note',agent.status==='离线'?'此设备离线。正式版将把修改标为等待设备上线；这里仅演示界面。':'设置由所在机器应用。账户不会复制 Codex 凭据，也不会自动同步项目文件。'));append(actions,button('取消',closeModal),button('保存示例设置',()=>{agent.name=name.value.trim()||agent.name;agent.model=model.value;agent.effort=effort.value;agent.path=path.value;agent.enabled=enabled.checked;closeModal();renderDashboard();notify(agent.status==='离线'?'示例设置已保存 · 等待设备上线（模拟）':'示例设置已保存')},'primary'))})}
function newAgent(){modal('添加本机员工',(body,actions)=>{const name=field(body,'员工名称','新员工');body.append(el('div','note','将在当前 5090 工作站上创建。模型和目录可以在员工设置里调整；本设计稿不会启动 agent。'));append(actions,button('取消',closeModal),button('添加示例员工',()=>{agents.push({id:'a'+Date.now(),name:name.value.trim()||'新员工',model:'gpt-5.6-sol',effort:'medium',machine:'5090 工作站',status:'空闲',path:'尚未选择',enabled:false});closeModal();renderDashboard()},'primary'))})}
function newProject(){memberView=false;modal('新建项目',(body,actions)=>{const name=field(body,'项目名称','');name.placeholder='例如：实验数据分析';name.maxLength=60;body.append(el('div','note','你将成为群主。进入项目后可以邀请成员、派遣员工和选择管理员。'));append(actions,button('取消',closeModal),button('创建并进入',()=>{if(!name.value.trim()){name.focus();return}const p={id:'p'+Date.now(),name:name.value.trim(),last:'刚刚',admin:'',assigned:[],messages:[],participants:[]};projects.unshift(p);closeModal();openProject(p)},'primary'))})}
function renderDashboard(){nav('dashboard');selectedProject=null;const c=$('content');c.replaceChildren();c.append(pageHeader('控制台','管理你的员工，继续项目中的讨论。'));const cols=el('div','columns');const left=el('section'),right=el('section');const lh=el('div','section-head');append(lh,el('h2','','我的 Agents'),button('＋ 添加员工',newAgent));left.append(lh);const ap=el('div','panel');const filterrow=el('div','row');filterrow.style.marginBottom='19px';filterrow.append(el('span','muted small','跨设备共享 · 工作目录留在本机'));const select=el('select','filter');[['all','全部机器'],['local','仅当前机器']].forEach(([value,text])=>{const o=el('option','',text);o.value=value;select.append(o)});select.value=machineFilter;select.onchange=()=>{machineFilter=select.value;renderDashboard()};filterrow.append(select);ap.append(filterrow);agents.filter(a=>machineFilter==='all'||a.machine==='5090 工作站').forEach(a=>{const card=el('div','agent');const r=el('div','row'),identity=el('div','agent-name'),info=el('div');const stat=el('div','muted small');const dot=el('span','dot'+(a.status==='离线'?' offline':a.status==='工作中'?' busy':''));append(stat,dot,document.createTextNode(a.status+(a.enabled?'':' · 已暂停')));append(info,el('strong','',a.name),stat);append(identity,el('span','bot','◇'),info);append(r,identity,button('设置',()=>agentSettings(a)));append(card,r,el('div','agent-meta',a.model+' · '+a.machine));ap.append(card)});left.append(ap);const rh=el('div','section-head');append(rh,el('h2','','我的项目'),button('＋ 新建项目',newProject,'primary'));right.append(rh);const pp=el('div','panel');projects.forEach(p=>{const b=button('',()=>openProject(p),'project');append(b,el('div','project-name',p.name+'　›'),el('div','muted small','上次进入对话 · '+p.last));pp.append(b)});right.append(pp);right.append(el('p','hint','加入项目从邀请链接开始。你可以在项目里决定派遣哪些员工。'));append(cols,left,right);c.append(cols)}
function openProject(p){selectedProject=p;p.last='刚刚';renderProject()}
function invite(){modal('邀请成员',(body,actions)=>{body.append(el('p','muted','把邀请交给合作伙伴，对方确认加入后，可以派遣自己的员工。'));const code=field(body,'示例邀请','DEMO-INVITE-ONLY');code.readOnly=true;body.append(el('div','note','这是无效示例邀请，不会加入任何真实项目。正式版将提供复制邀请链接按钮。'));actions.append(button('完成',closeModal,'primary'))})}
function dispatch(){modal('派遣我的员工',(body,actions)=>{body.append(el('p','muted','你只能派遣和撤回自己的员工。离线或已暂停的员工暂不可派遣。'));const checks=[];agents.forEach(a=>{const line=el('label','setting-row');const check=el('input','check');check.type='checkbox';check.checked=selectedProject.assigned.includes(a.id);check.disabled=a.status==='离线'||!a.enabled;append(line,el('span','',a.name+' · '+a.machine+(a.status==='离线'?'（离线）':!a.enabled?'（已暂停）':'')),check);body.append(line);checks.push([a,check])});append(actions,button('取消',closeModal),button('确认派遣',()=>{selectedProject.assigned=checks.filter(([,check])=>check.checked).map(([a])=>a.id);closeModal();renderProject();notify('示例派遣已更新，未启动任何 agent')},'primary'))})}
function renderProject(){nav('dashboard');const p=selectedProject,c=$('content');c.replaceChildren();c.append(button('← 返回控制台',renderDashboard,'link back'));const header=pageHeader(p.name,'项目群聊 · 人类可查看项目内全部消息');const role=el('select','filter');[['owner','群主视角（示例）'],['member','受邀请成员视角（示例）']].forEach(([v,t])=>{const o=el('option','',t);o.value=v;role.append(o)});role.value=memberView?'member':'owner';role.onchange=()=>{memberView=role.value==='member';renderProject()};header.append(role);c.append(header);const grid=el('div','project-layout'),chat=el('div','panel chat');const head=el('div','chat-head');append(head,el('strong','','全部消息'),el('span','muted small','群聊与私聊均标明接收范围'));chat.append(head);const msgs=el('div','messages');if(!p.messages.length)msgs.append(el('div','empty','项目已准备好。派遣员工，开始第一次讨论。'));p.messages.forEach(m=>{const n=el('div','message'),b=el('div','bubble'),name=el('div','name',m.who);name.append(el('span','channel',m.channel));append(b,name,el('p','',m.text));append(n,el('span','avatar',m.who==='你'?'你':'◇'),b);msgs.append(n)});chat.append(msgs);const composer=el('form','composer');const input=el('input');input.placeholder='发送消息，和员工讨论下一步…';input.maxLength=2000;append(composer,input,button('发送',null,'primary'));composer.onsubmit=e=>{e.preventDefault();if(!input.value.trim())return;p.messages.push({who:'你',text:input.value.trim(),channel:'群聊'});renderProject();notify('示例消息已发送 · agent 不会实际运行')};chat.append(composer);const members=el('div','panel');members.append(el('h3','','成员与员工'));[['你',memberView?'成员':'群主'],...(p.participants===undefined?[['合作伙伴','成员']]:p.participants)].forEach(([name,roleName])=>{const r=el('div','member');const label=el('span','',name);label.append(el('span','badge',roleName));append(r,el('span','avatar',name.slice(0,1)),label);members.append(r)});p.assigned.forEach(id=>{const a=agents.find(x=>x.id===id);if(a){const r=el('div','member');const txt=el('div');append(txt,el('strong','small',a.name),el('div','muted small',a.machine));append(r,el('span','bot','◇'),txt);members.append(r)}});members.append(el('div','divider'));const actions=el('div','member-actions');actions.append(button('派遣我的员工',dispatch));if(!memberView)actions.append(button('邀请成员',invite));members.append(actions);if(!memberView){const admin=field(members,'管理员 Agent',p.admin,['未设置',...p.assigned.map(id=>agents.find(a=>a.id===id)?.name).filter(Boolean)]);admin.value=agents.find(a=>a.id===p.admin)?.name||'未设置';admin.onchange=()=>{p.admin=agents.find(a=>a.name===admin.value)?.id||'';notify('示例管理员已更新')}}else members.append(el('div','note','成员视角：管理员与邀请由群主设置。你的员工设置仍由你管理。'));members.append(el('p','hint','仅收到群聊或指定给自己的私聊的 agent 能看到该消息。人类可以审阅全部。'));append(grid,chat,members);c.append(grid);msgs.scrollTop=msgs.scrollHeight}
function renderSettings(){nav('settings');selectedProject=null;const c=$('content');c.replaceChildren();c.append(pageHeader('设置','日常协作在控制台进行，这里管理账户和本机偏好。'));const list=el('div','settings');const account=el('section','panel');account.append(el('h2','','账户与设备'));const nameRow=el('div','setting-row');append(nameRow,el('div','',currentUser+' · 示例账户'),button('修改名称',()=>modal('账户名称',(b,a)=>{const name=field(b,'显示名称',currentUser);append(a,button('取消',closeModal),button('保存',()=>{currentUser=name.value.trim()||currentUser;$('profileName').textContent=currentUser;closeModal();renderSettings()},'primary'))})));account.append(nameRow);account.append(button('退出示例账户',()=>{$('app').classList.add('hidden');$('login').classList.remove('hidden')}));['5090 工作站 · 当前设备','实验室 4090 · 已关联'].forEach(text=>{const r=el('div','setting-row');append(r,el('div','device',text),el('span','muted small','同一账户'));account.append(r)});const add=el('div','setting-row');append(add,el('div','muted small','新电脑需要已有设备批准'),button('关联新设备',()=>modal('新增设备请求',(b,a)=>{b.append(el('div','note','示例请求：新电脑希望加入此账户。状态：等待已有设备批准。此预览不会生成真实授权。'));append(a,button('关闭',closeModal),button('批准示例请求',()=>{closeModal();notify('示例设备已批准；真实设备未发生变化')},'primary'))})));account.append(add);list.append(account);const machine=el('section','panel');machine.append(el('h2','','本机'));[['关闭窗口后继续接收任务',true],['开机后自动启动',false]].forEach(([text,value])=>{const r=el('label','setting-row'),check=el('input','check');check.type='checkbox';check.checked=value;check.onchange=()=>notify('仅修改示例偏好，不改变后台进程或开机设置');append(r,el('span','',text),check);machine.append(r)});machine.append(el('p','hint','这些偏好只影响当前设备，不替其他机器作决定。'));list.append(machine);const storage=el('section','panel');append(storage,el('h2','','存储与备份'),el('p','muted small','账户资料保存在设备上；项目消息跨设备共享。项目文件不自动同步。'));const exportButton=button('账户备份（尚未实现）',null);exportButton.disabled=true;storage.append(exportButton);list.append(storage);const appearance=el('section','panel');appearance.append(el('h2','','外观
